<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#tfBg)"/>
  <text x="400" y="38" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Propagation of Sound from a Vibrating Tuning Fork</text>
  <text x="400" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Longitudinal Waves: Compressions (C) &amp; Rarefactions (R)</text>

  <!-- Tuning Fork -->
  <g transform="translate(50, 110)">
    <!-- Prongs -->
    <rect x="30" y="20" width="14" height="150" rx="4" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="70" y="20" width="14" height="150" rx="4" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5"/>
    <!-- Base curve -->
    <path d="M 30 170 C 30 200 84 200 84 170 Z" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5"/>
    <!-- Stem/Handle -->
    <rect x="50" y="190" width="14" height="80" rx="2" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="44" y="270" width="26" height="12" rx="3" fill="#cbd5e1"/>

    <!-- Vibration motion arcs on right prong -->
    <path d="M 88 40 Q 100 80 88 120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M 94 30 Q 110 80 94 130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
    <!-- Vibration motion arcs on left prong -->
    <path d="M 26 40 Q 14 80 26 120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M 20 30 Q 4 80 20 130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>

    <text x="57" y="310" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Tuning Fork</text>
    <text x="57" y="326" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">(Vibrating body)</text>
  </g>

  <!-- Air Layers Representation (Compressions & Rarefactions) -->
  <!-- C1 -->
  <g transform="translate(200, 110)">
    <rect x="0" y="20" width="40" height="180" fill="#38bdf8" fill-opacity="0.35" rx="4"/>
    <line x1="5" y1="30" x2="5" y2="190" stroke="#38bdf8" stroke-width="2"/>
    <line x1="12" y1="30" x2="12" y2="190" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="20" y1="30" x2="20" y2="190" stroke="#38bdf8" stroke-width="3"/>
    <line x1="28" y1="30" x2="28" y2="190" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="35" y1="30" x2="35" y2="190" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="225" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">C</text>
    <text x="20" y="242" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">High Density</text>
  </g>

  <!-- R1 -->
  <g transform="translate(270, 110)">
    <rect x="0" y="20" width="60" height="180" fill="#64748b" fill-opacity="0.1" rx="4"/>
    <line x1="15" y1="30" x2="15" y2="190" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="45" y1="30" x2="45" y2="190" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="30" y="225" fill="#f59e0b" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">R</text>
    <text x="30" y="242" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Low Density</text>
  </g>

  <!-- C2 -->
  <g transform="translate(360, 110)">
    <rect x="0" y="20" width="40" height="180" fill="#38bdf8" fill-opacity="0.35" rx="4"/>
    <line x1="5" y1="30" x2="5" y2="190" stroke="#38bdf8" stroke-width="2"/>
    <line x1="12" y1="30" x2="12" y2="190" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="20" y1="30" x2="20" y2="190" stroke="#38bdf8" stroke-width="3"/>
    <line x1="28" y1="30" x2="28" y2="190" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="35" y1="30" x2="35" y2="190" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="225" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">C</text>
  </g>

  <!-- R2 -->
  <g transform="translate(430, 110)">
    <rect x="0" y="20" width="60" height="180" fill="#64748b" fill-opacity="0.1" rx="4"/>
    <line x1="15" y1="30" x2="15" y2="190" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="45" y1="30" x2="45" y2="190" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="30" y="225" fill="#f59e0b" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">R</text>
  </g>

  <!-- C3 -->
  <g transform="translate(520, 110)">
    <rect x="0" y="20" width="40" height="180" fill="#38bdf8" fill-opacity="0.35" rx="4"/>
    <line x1="5" y1="30" x2="5" y2="190" stroke="#38bdf8" stroke-width="2"/>
    <line x1="12" y1="30" x2="12" y2="190" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="20" y1="30" x2="20" y2="190" stroke="#38bdf8" stroke-width="3"/>
    <line x1="28" y1="30" x2="28" y2="190" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="35" y1="30" x2="35" y2="190" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="225" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">C</text>
  </g>

  <!-- R3 -->
  <g transform="translate(590, 110)">
    <rect x="0" y="20" width="60" height="180" fill="#64748b" fill-opacity="0.1" rx="4"/>
    <line x1="15" y1="30" x2="15" y2="190" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="45" y1="30" x2="45" y2="190" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="30" y="225" fill="#f59e0b" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">R</text>
  </g>

  <!-- Wavelength Bracket between C1 and C2 -->
  <line x1="220" y1="90" x2="380" y2="90" stroke="#a855f7" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <circle cx="220" cy="90" r="3" fill="#a855f7"/>
  <circle cx="380" cy="90" r="3" fill="#a855f7"/>
  <text x="300" y="82" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Wavelength (&lambda;)</text>

  <!-- Direction of Propagation -->
  <line x1="200" y1="380" x2="700" y2="380" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <polygon points="705,380 690,373 690,387" fill="#22c55e"/>
  <text x="450" y="410" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Direction of Wave Propagation &#10140;</text>
</svg>
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: marginalia
      POSTGRES_PASSWORD: marginalia
      POSTGRES_DB: marginalia
    ports:
      - "5432:5432"
    volumes:
      - "./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql"

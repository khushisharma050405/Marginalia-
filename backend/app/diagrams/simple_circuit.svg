<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#scBg)"/>
  <text x="400" y="38" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Basic Electric Circuit Diagram</text>
  <text x="400" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Closed Circuit with Cell, Plug Key, Ammeter, and Resistor / Bulb</text>

  <!-- Main Circuit Wires (Rectangle with rounded corners) -->
  <path d="M 150 120 L 650 120 L 650 360 L 150 360 Z" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linejoin="round"/>

  <!-- Cell / Battery on Top Wire -->
  <g transform="translate(370, 100)">
    <rect x="-30" y="10" width="60" height="20" fill="#0f172a"/> <!-- Break wire -->
    <!-- Positive terminal (longer, thinner line) -->
    <line x1="-10" y1="-5" x2="-10" y2="45" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <!-- Negative terminal (shorter, thicker line) -->
    <line x1="10" y1="8" x2="10" y2="32" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>
    <text x="-25" y="25" fill="#f59e0b" font-family="sans-serif" font-size="16" font-weight="bold">+</text>
    <text x="25" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="bold">&minus;</text>
    <text x="0" y="-15" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cell / Battery</text>
  </g>

  <!-- Direction of Conventional Current (Top wire: left to right) -->
  <polygon points="260,120 245,114 245,126" fill="#ef4444"/>
  <text x="250" y="105" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Current I &rarr;</text>

  <!-- Bulb / Lamp on Right Wire -->
  <g transform="translate(650, 240)">
    <rect x="-20" y="-30" width="40" height="60" fill="#0f172a"/> <!-- Break wire -->
    <!-- Circle with filament X -->
    <circle cx="0" cy="0" r="26" fill="#fef08a" fill-opacity="0.2" stroke="#eab308" stroke-width="3"/>
    <path d="M -12 -12 L 12 12 M -12 12 L 12 -12" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
    <text x="45" y="5" fill="#facc15" font-family="sans-serif" font-size="13" font-weight="bold">Electric Bulb / Lamp</text>
    <text x="45" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11">(Load Resistance)</text>
  </g>

  <!-- Plug Key (Closed) on Bottom Wire -->
  <g transform="translate(400, 360)">
    <rect x="-40" y="-10" width="80" height="20" fill="#0f172a"/> <!-- Break wire -->
    <!-- Brackets () -->
    <path d="M -20 -15 C -30 -5 -30 5 -20 15" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 -15 C 30 -5 30 5 20 15" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <!-- Closed dot -->
    <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
    <text x="0" y="35" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Plug Key (Closed)</text>
  </g>

  <!-- Ammeter on Left Wire -->
  <g transform="translate(150, 240)">
    <rect x="-20" y="-30" width="40" height="60" fill="#0f172a"/> <!-- Break wire -->
    <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#a855f7" stroke-width="3"/>
    <text x="0" y="8" fill="#c084fc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">A</text>
    <text x="-40" y="0" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">Ammeter</text>
    <text x="-40" y="16" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="end">(Series connection)</text>
  </g>

  <!-- Current Direction on Left Wire (downwards) -->
  <polygon points="150,310 144,295 156,295" fill="#ef4444"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="earBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pinnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="cochleaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#earBg)"/>
  <text x="400" y="38" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Anatomy of the Human Ear (Auditory System)</text>
  <text x="400" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">NCERT Class 8 &amp; 9 Science · Chapter: Sound</text>

  <!-- Regions Boxes -->
  <rect x="40" y="80" width="210" height="390" rx="10" fill="#334155" fill-opacity="0.3" stroke="#475569" stroke-dasharray="4"/>
  <text x="145" y="102" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">OUTER EAR</text>
  <rect x="260" y="80" width="220" height="390" rx="10" fill="#334155" fill-opacity="0.3" stroke="#475569" stroke-dasharray="4"/>
  <text x="370" y="102" fill="#ec4899" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MIDDLE EAR</text>
  <rect x="490" y="80" width="270" height="390" rx="10" fill="#334155" fill-opacity="0.3" stroke="#475569" stroke-dasharray="4"/>
  <text x="625" y="102" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">INNER EAR</text>

  <!-- Pinna -->
  <path d="M 90 140 C 60 160 50 250 80 320 C 100 370 120 390 140 370 C 150 350 140 330 130 300 C 110 240 120 180 140 160 C 150 150 120 130 90 140 Z" fill="url(#pinnaGrad)" stroke="#ea580c" stroke-width="2.5"/>
  <text x="100" y="240" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="bold">Pinna</text>

  <!-- Ear Canal -->
  <path d="M 135 240 C 170 240 210 250 260 255 L 260 285 C 210 280 170 270 135 270 Z" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="195" y="310" fill="#fed7aa" font-family="sans-serif" font-size="12" text-anchor="middle">Ear Canal (Auditory Meatus)</text>

  <!-- Sound wave arrows entering -->
  <path d="M 30 255 Q 50 245 70 255" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 40 260 Q 60 250 80 260" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="45" y="290" fill="#38bdf8" font-family="sans-serif" font-size="11">Sound Waves</text>

  <!-- Tympanic Membrane / Eardrum -->
  <ellipse cx="265" cy="270" rx="5" ry="22" fill="#f43f5e" stroke="#fff" stroke-width="1.5"/>
  <text x="265" y="230" fill="#fda4af" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Eardrum</text>
  <text x="265" y="244" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">(Tympanum)</text>

  <!-- Ossicles: Hammer (Malleus), Anvil (Incus), Stirrup (Stapes) -->
  <!-- Malleus -->
  <line x1="268" y1="265" x2="305" y2="250" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <circle cx="305" cy="250" r="6" fill="#fbbf24"/>
  <!-- Incus -->
  <path d="M 305 250 L 335 240 L 340 270 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <!-- Stapes -->
  <path d="M 340 270 L 365 265 L 365 285 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <line x1="365" y1="275" x2="378" y2="275" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

  <text x="340" y="205" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ear Ossicles (3 Bones)</text>
  <text x="340" y="220" fill="#fde68a" font-family="sans-serif" font-size="10" text-anchor="middle">1. Malleus (Hammer) · 2. Incus (Anvil) · 3. Stapes (Stirrup)</text>

  <!-- Cochlea (spiral) -->
  <g transform="translate(510, 240)">
    <!-- Semicircular canals -->
    <path d="M 0 0 C -20 -40 20 -70 40 -30" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round"/>
    <path d="M 20 -30 C 50 -70 80 -40 60 0" fill="none" stroke="#c084fc" stroke-width="6" stroke-linecap="round"/>
    <!-- Spiral shell -->
    <path d="M 10 10 C 30 -20 80 0 70 40 C 60 70 10 70 0 40 C -10 20 20 10 35 25 C 45 35 35 50 25 45" fill="none" stroke="url(#cochleaGrad)" stroke-width="14" stroke-linecap="round"/>
  </g>
  <text x="560" y="345" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cochlea</text>
  <text x="560" y="360" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">(Converts vibrations to electrical impulses)</text>

  <!-- Auditory Nerve -->
  <path d="M 580 270 Q 640 250 710 240" fill="none" stroke="#eab308" stroke-width="8" stroke-linecap="round"/>
  <text x="665" y="225" fill="#facc15" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Auditory Nerve</text>
  <text x="665" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">To Brain &#10140;</text>

  <!-- Eustachian Tube -->
  <path d="M 360 290 Q 380 370 340 430" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <text x="365" y="410" fill="#94a3b8" font-family="sans-serif" font-size="11">Eustachian Tube</text>
  <text x="365" y="424" fill="#64748b" font-family="sans-serif" font-size="9">(Equalizes air pressure)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="fcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="850" height="420" rx="16" fill="url(#fcBg)"/>
  <text x="425" y="38" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Terrestrial Food Chain &amp; Energy Flow</text>
  <text x="425" y="58" fill="#a7f3d0" font-family="sans-serif" font-size="12" text-anchor="middle">Unidirectional flow of energy across trophic levels (10% Law of Energy Transfer)</text>

  <!-- Level 1: Sun -->
  <circle cx="70" cy="180" r="32" fill="#f59e0b" stroke="#fbbf24" stroke-width="3"/>
  <text x="70" y="185" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SUN</text>
  <text x="70" y="230" fill="#fde68a" font-family="sans-serif" font-size="11" text-anchor="middle">Solar Energy</text>

  <!-- Arrow to Producer -->
  <path d="M 115 180 L 155 180" stroke="#fbbf24" stroke-width="3" marker-end="url(#arr)"/>
  <polygon points="160,180 148,174 148,186" fill="#fbbf24"/>

  <!-- Level 2: Producer (Grass/Plants) -->
  <g transform="translate(170, 110)">
    <rect x="0" y="0" width="130" height="140" rx="10" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="65" y="30" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1st Trophic Level</text>
    <text x="65" y="65" fill="#fff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Plants / Grass</text>
    <rect x="15" y="85" width="100" height="24" rx="4" fill="#047857"/>
    <text x="65" y="101" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PRODUCER</text>
    <text x="65" y="128" fill="#6ee7b7" font-family="sans-serif" font-size="10" text-anchor="middle">10,000 J Energy</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 310 180 L 340 180" stroke="#34d399" stroke-width="3"/>
  <polygon points="345,180 333,174 333,186" fill="#34d399"/>

  <!-- Level 3: Primary Consumer (Herbivore / Grasshopper) -->
  <g transform="translate(355, 110)">
    <rect x="0" y="0" width="130" height="140" rx="10" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2"/>
    <text x="65" y="30" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2nd Trophic Level</text>
    <text x="65" y="65" fill="#fff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Grasshopper</text>
    <rect x="10" y="85" width="110" height="24" rx="4" fill="#0369a1"/>
    <text x="65" y="101" fill="#7dd3fc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PRIMARY CONSUMER</text>
    <text x="65" y="128" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">1,000 J Energy</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 495 180 L 525 180" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="530,180 518,174 518,186" fill="#38bdf8"/>

  <!-- Level 4: Secondary Consumer (Carnivore / Frog) -->
  <g transform="translate(540, 110)">
    <rect x="0" y="0" width="130" height="140" rx="10" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/>
    <text x="65" y="30" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3rd Trophic Level</text>
    <text x="65" y="65" fill="#fff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Frog</text>
    <rect x="10" y="85" width="110" height="24" rx="4" fill="#6d28d9"/>
    <text x="65" y="101" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SECONDARY CONSUMER</text>
    <text x="65" y="128" fill="#d8b4fe" font-family="sans-serif" font-size="10" text-anchor="middle">100 J Energy</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 680 180 L 710 180" stroke="#c084fc" stroke-width="3"/>
  <polygon points="715,180 703,174 703,186" fill="#c084fc"/>

  <!-- Level 5: Tertiary Consumer (Apex / Hawk) -->
  <g transform="translate(720, 110)">
    <rect x="0" y="0" width="115" height="140" rx="10" fill="#831843" stroke="#f472b6" stroke-width="2"/>
    <text x="57" y="30" fill="#fbcfe8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4th Level</text>
    <text x="57" y="65" fill="#fff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Hawk</text>
    <rect x="8" y="85" width="100" height="24" rx="4" fill="#be185d"/>
    <text x="57" y="101" fill="#f472b6" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">APEX PREDATOR</text>
    <text x="57" y="128" fill="#f9a8d4" font-family="sans-serif" font-size="10" text-anchor="middle">10 J Energy</text>
  </g>

  <!-- Bottom Explanatory Ribbon -->
  <rect x="80" y="290" width="690" height="80" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>
  <text x="425" y="318" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Lindeman&#39;s 10% Energy Transfer Law</text>
  <text x="425" y="340" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">Only about 10% of the organic matter and energy is passed on to the next trophic level.</text>
  <text x="425" y="358" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">90% is consumed in metabolic processes (respiration, movement, heat loss).</text>
</svg>